<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Border -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="4" />

  <!-- Background Accent Elements -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#312e81" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Lightning Spark / Hackathon Innovation Glyph -->
  <path d="M72 18 L36 68 L60 68 L54 110 L92 56 L68 56 Z" 
        fill="url(#boltGrad)" 
        stroke="#ffffff" 
        stroke-width="1.5" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Clean Tech Micro Dots -->
  <circle cx="28" cy="30" r="3" fill="#10b981" />
  <circle cx="100" cy="30" r="3" fill="#6366f1" />
  <circle cx="28" cy="98" r="3" fill="#f59e0b" />
  <circle cx="100" cy="98" r="3" fill="#38bdf8" />
</svg>
